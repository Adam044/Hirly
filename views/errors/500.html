<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | Hirly</title>
    <link rel="stylesheet" href="/styling/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .error-page-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--background-light);
            text-align: center;
            padding: 2rem;
        }
        .error-card {
            background: white;
            padding: 4rem;
            border-radius: 32px;
            box-shadow: var(--shadow-xl);
            max-width: 600px;
            width: 100%;
            border: 1px solid var(--border-color);
        }
        .error-icon {
            font-size: 5rem;
            color: var(--danger);
            margin-bottom: 2rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .error-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 1rem;
        }
        .error-text {
            color: var(--text-body);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        .btn-home {
            padding: 1.25rem 2.5rem;
            font-size: 1.1rem;
            border-radius: 16px;
        }
    </style>
</head>
<body>
    <div class="error-page-container">
        <div class="error-card">
            <div class="error-icon">
                <i class="fas fa-server"></i>
            </div>
            <h1 class="error-title">Systems Offline.</h1>
            <p class="error-text">
                Something went wrong on our end. Our technical team has been notified 
                and is working to restore your professional hub.
            </p>
            <a href="/" class="btn btn-secondary btn-home">
                <i class="fas fa-sync mr-2"></i> Try Refreshing
            </a>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NHWNSKWN0N"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      
      gtag('config', 'G-NHWNSKWN0N');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="email_verified_success_title">Email Verified - Hirly</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling -->
    <link rel="stylesheet" href="/styling/main.css">
    <link rel="stylesheet" href="/styling/pages/page-auth.css">
    <style>
        .success-icon-large {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: bounce 0.6s ease-out;
            color: white;
            font-size: 50px;
            font-weight: bold;
        }

        @keyframes bounce {
            0% { transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #4A90E2;
            animation: confetti-fall 3s linear infinite;
            z-index: 0;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- Header will be loaded by components.js -->
    <div id="headerPlaceholder"></div>

    <main class="main container">
        <div class="auth-container text-center" style="position: relative; overflow: hidden;">
            <!-- Confetti Animation -->
            <div class="confetti" style="left: 10%; animation-delay: 0s; background: #4A90E2;"></div>
            <div class="confetti" style="left: 30%; animation-delay: 1s; background: #FF9800;"></div>
            <div class="confetti" style="left: 50%; animation-delay: 2s; background: #9C27B0;"></div>
            <div class="confetti" style="left: 70%; animation-delay: 0.8s; background: #FF5722;"></div>
            <div class="confetti" style="left: 90%; animation-delay: 1.8s; background: #795548;"></div>

            <div class="auth-title">
                <div class="success-icon-large">✓</div>
                <h2 data-lang-key="email_verified_heading">🎉 تهانينا!</h2>
                <p data-lang-key="email_verified_subtitle">
                    تم تفعيل بريدك الإلكتروني بنجاح في منصة <span class="brand-name" style="color: var(--primary); font-weight: bold;">هايرلي</span>.<br>
                    يمكنك الآن الاستمتاع بجميع خدمات المنصة!
                </p>
            </div>

            <div class="mt-4">
                <a href="/login.html" class="btn btn-primary btn-block" data-lang-key="login_now_btn">
                    🚀 تسجيل الدخول الآن
                </a>
            </div>

            <div class="auth-footer mt-4" style="background: var(--background-light); padding: 20px; border-radius: 12px; border-right: 4px solid var(--primary);">
                <p style="text-align: right; color: var(--text-muted); font-size: 14px; line-height: 1.6;">
                    <strong>ماذا بعد؟</strong><br>
                    • قم بتسجيل الدخول لإكمال ملفك الشخصي<br>
                    • استكشف الفرص المتاحة على المنصة<br>
                    • ابدأ رحلتك المهنية معنا
                </p>
            </div>
        </div>
    </main>

    <div id="footerPlaceholder"></div>

    <script src="/language/language.js"></script>
    <script src="/components.js"></script>
</body>
</html>

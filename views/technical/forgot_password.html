<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NHWNSKWN0N"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
     
      gtag('config', 'G-NHWNSKWN0N');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="forgot_password_title">Forgot Password - Hirly</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling -->
    <link rel="stylesheet" href="/styling/main.css">
    <!-- Page-specific CSS (MUST be loaded after global-rtl.css) -->
    <link rel="stylesheet" href="/styling/pages/page-auth.css">

    <!-- Custom CSS for multi-step form -->
    <style>
        .form-section {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Header will be loaded by components.js -->
    <div id="headerPlaceholder"></div>

    <main class="main container">
        <div class="auth-container">
            <div class="auth-title">
                <i class="fas fa-unlock-keyhole fa-3x text-primary mb-3"></i>
                <h2 data-lang-key="forgot_password_heading">Forgot Your Password?</h2>
                <p id="form-subtitle" data-lang-key="forgot_password_subtitle">Enter your email address below to receive a reset code.</p>
            </div>

            <!-- Email Input Form (Step 1) -->
            <form id="forgotPasswordForm" class="form-section" data-step="1">
                <div class="form-group">
                    <label for="email" class="form-label" data-lang-key="email_address_label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" data-lang-key="email_placeholder" placeholder="Enter your email" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" data-lang-key="send_reset_code_btn">Send Reset Code <span class="loading-spinner" id="sendLinkSpinner"></span></button>
            </form>

            <!-- Verification Code Input Form (Step 2) -->
            <form id="verifyCodeForm" class="form-section" data-step="2">
                <div class="form-group">
                    <label for="verificationCode" class="form-label" data-lang-key="verification_code_label">Verification Code</label>
                    <input type="text" id="verificationCode" name="verificationCode" class="form-control" data-lang-key="code_placeholder" placeholder="Enter the 6-digit code" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" data-lang-key="verify_code_btn">Verify Code <span class="loading-spinner" id="verifyCodeSpinner"></span></button>
                <div class="mt-3 text-center">
                    <button type="button" id="resendCodeLink" class="btn btn-link" data-lang-key="resend_code_link">Resend Code</button>
                </div>
            </form>

            <div id="forgotPasswordMessage" class="mt-3 text-center"></div>
            <div class="auth-footer">
                <p><a href="/login.html" data-lang-key="back_to_login_link">Back to Login</a></p>
            </div>
        </div>
    </main>

    <div id="footerPlaceholder"></div>

    <!-- Load scripts in correct order at the end of the body -->
    <script src="/language/language.js"></script>
    <script src="/language/auth-page-translations.js"></script>
    <script src="/components.js"></script>
    <script src="/js/forgot_password.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NHWNSKWN0N"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
     
      gtag('config', 'G-NHWNSKWN0N');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="forgot_password_title">Forgot Password - Hirly</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling -->
    <link rel="stylesheet" href="/styling/main.css">
    <!-- Page-specific CSS (MUST be loaded after global-rtl.css) -->
    <link rel="stylesheet" href="/styling/pages/page-auth.css">

    <!-- Custom CSS for multi-step form -->
    <style>
        .form-section {
            display: none;
        }
    </style>
</head>
<body class="auth-page-body">
    <!-- Header will be loaded by components.js -->
    <div id="headerPlaceholder"></div>

    <main class="auth-main">
        <div class="auth-container">
            <header class="auth-header">
                <i class="fas fa-unlock-keyhole fa-3x text-primary mb-3"></i>
                <h2 data-lang-key="forgot_password_heading">Forgot Your Password?</h2>
                <p id="form-subtitle" data-lang-key="forgot_password_subtitle">Enter your email address below to receive a reset code.</p>
            </header>

            <!-- Email Input Form (Step 1) -->
            <form id="forgotPasswordForm" class="auth-form form-section" data-step="1">
                <div class="form-group">
                    <label for="email" data-lang-key="email_address_label">Email Address</label>
                    <div class="auth-input-wrapper">
                        <input type="email" id="email" class="auth-input" data-lang-key="email_placeholder" placeholder="Enter your email" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                </div>
                <button type="submit" class="auth-btn-primary" data-lang-key="send_reset_code_btn">
                    <span>Send Reset Code</span>
                    <i class="fas fa-paper-plane"></i>
                    <span class="loading-spinner" id="sendLinkSpinner"></span>
                </button>
            </form>

            <!-- Verification Code Input Form (Step 2) -->
            <form id="verifyCodeForm" class="auth-form form-section" data-step="2">
                <div class="form-group">
                    <label for="verificationCode" data-lang-key="verification_code_label">Verification Code</label>
                    <div class="auth-input-wrapper code-input-wrapper">
                        <input type="text" id="verificationCode" class="auth-input otp-input" placeholder="000000" maxlength="6" required>
                        <i class="fas fa-shield-halved"></i>
                    </div>
                </div>
                <button type="submit" class="auth-btn-primary" data-lang-key="verify_code_btn">
                    <span>Verify Code</span>
                    <i class="fas fa-check-circle"></i>
                    <span class="loading-spinner" id="verifyCodeSpinner"></span>
                </button>
                <div class="mt-4 text-center">
                    <button type="button" id="resendCodeLink" class="auth-link" data-lang-key="resend_code_link" style="background: none; border: none; cursor: pointer;">Resend Code</button>
                </div>
            </form>

            <style>
                .otp-input {
                    text-align: center;
                    letter-spacing: 0.8rem;
                    font-size: 1.5rem;
                    font-weight: 700;
                    font-family: monospace;
                    padding-left: 2rem !important; /* Offset for the icon and spacing */
                }
                .otp-input::placeholder {
                    letter-spacing: normal;
                    font-family: inherit;
                    font-size: 1rem;
                    font-weight: 400;
                    opacity: 0.5;
                }
                [dir="rtl"] .otp-input {
                    padding-right: 2rem !important;
                    padding-left: 1rem !important;
                }
            </style>

            <div id="forgotPasswordMessage" class="mt-4 text-center" style="font-weight: 600; font-size: 0.9rem;"></div>
            
            <footer class="auth-footer">
                <a href="/login.html" class="auth-link" data-lang-key="back_to_login_link">Back to Login</a>
            </footer>
        </div>
    </main>

    <div id="footerPlaceholder"></div>

    <!-- Load scripts in correct order at the end of the body -->
    <script src="/language/language.js"></script>
    <script src="/language/auth-page-translations.js"></script>
    <script src="/components.js"></script>
    <script src="/js/forgot_password.js"></script>
</body>
</html>

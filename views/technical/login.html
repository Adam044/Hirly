<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <!-- Google tag (gtag.js) -->

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-NHWNSKWN0N');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="login_title">Login — Hirly</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styling/main.css">
    <link rel="stylesheet" href="/styling/pages/page-auth.css">
</head>
<body class="auth-page-body">
    <div id="headerPlaceholder"></div>

    <main class="auth-main">
        <div class="auth-container">
            <header class="auth-header" id="authHeader">
                <h1 data-lang-key="welcome_back_heading">Welcome Back</h1>
                <p data-lang-key="login_subtitle">Login to access your Hirly account</p>
            </header>

            <!-- Step 1: Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email" data-lang-key="email_address_label">Email Address</label>
                    <div class="auth-input-wrapper">
                        <input type="email" id="email" class="auth-input" data-lang-key="email_placeholder" placeholder="Enter your email" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" data-lang-key="password_label">Password</label>
                    <div class="auth-input-wrapper">
                        <input type="password" id="password" class="auth-input" placeholder="••••••••" required>
                        <i class="fas fa-lock"></i>
                    </div>
                </div>

                <div class="auth-extra">
                    <a href="/forgot_password.html" class="auth-link" data-lang-key="forgot_password_link">Forgot password?</a>
                </div>

                <button type="submit" class="auth-btn-primary">
                    <span data-lang-key="login_btn">Login</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <!-- Step 2: OTP Form (Hidden by default) -->
            <form id="otpForm" class="auth-form" style="display: none;">
                <div class="form-group" style="text-align: center;">
                    <p style="margin-bottom: 1.5rem; color: #64748b;">We've sent a 6-digit activation code to your email. Please enter it below to continue.</p>
                    <div class="auth-input-wrapper">
                        <input type="text" id="otpCode" class="auth-input" placeholder="000000" maxlength="6" pattern="\d{6}" style="text-align: center; letter-spacing: 10px; font-size: 1.5rem; font-weight: bold;" required>
                    </div>
                </div>
                <button type="submit" class="auth-btn-primary">
                    <span>Verify Code</span>
                    <i class="fas fa-shield-alt"></i>
                </button>
            </form>

            <!-- Step 3: Set Password Form (Hidden by default) -->
            <form id="activationSetPasswordForm" class="auth-form" style="display: none;">
                <div class="form-group">
                    <label for="newPass">Set New Password</label>
                    <div class="auth-input-wrapper">
                        <input type="password" id="newPass" class="auth-input" placeholder="••••••••" minlength="8" required>
                        <i class="fas fa-lock"></i>
                    </div>
                    <p style="font-size: 0.75rem; color: #94a3b8; margin-top: 5px;">Min 8 chars, 1 uppercase, 1 lowercase, 1 number</p>
                </div>
                <div class="form-group">
                    <label for="confirmPass">Confirm Password</label>
                    <div class="auth-input-wrapper">
                        <input type="password" id="confirmPass" class="auth-input" placeholder="••••••••" minlength="8" required>
                        <i class="fas fa-lock"></i>
                    </div>
                </div>
                <button type="submit" class="auth-btn-primary">
                    <span>Activate Account</span>
                    <i class="fas fa-check-circle"></i>
                </button>
            </form>

            <footer class="auth-footer" id="authFooter">
                <p data-lang-key="no_account_question">Don't have an account?</p>
                <a href="/signup.html" class="auth-link" style="font-size: 1.1rem;" data-lang-key="sign_up">Create a free account</a>
            </footer>

            <div id="loginMessage" class="mt-4 text-center" style="font-weight: 600; font-size: 0.9rem;"></div>
        </div>
    </main>

    <div id="footerPlaceholder"></div>

    <script src="/language/language.js"></script>
    <script src="/language/auth-page-translations.js"></script>
    <script src="/auth.js" defer></script>
    <script src="/components.js" defer></script>
</body>
</html>

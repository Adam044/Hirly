<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NHWNSKWN0N"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
     
      gtag('config', 'G-NHWNSKWN0N');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="reset_password_title">Reset Password - Hirly</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling -->
    <link rel="stylesheet" href="/styling/main.css">
    <!-- Page-specific CSS (MUST be loaded after global-rtl.css) -->
    <link rel="stylesheet" href="/styling/pages/page-auth.css">

    <!-- Custom CSS for the modal -->
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fefefe;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .modal-content h3 {
            margin-top: 0;
            color: #1a202c;
            font-size: 1.5rem;
        }

        .modal-content p {
            font-size: 1rem;
            color: #4a5568;
            margin-bottom: 20px;
        }

        .modal-content button {
            background-color: #4c51bf;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .modal-content button:hover {
            background-color: #434190;
        }
    </style>
</head>
<body>
    <!-- Header will be loaded by components.js -->
    <div id="headerPlaceholder"></div>

    <main class="main container">
        <div class="auth-container">
            <div class="auth-title">
                <h2 data-lang-key="reset_password_heading">Reset Your Password</h2>
                <p data-lang-key="reset_password_subtitle">Enter your new password below.</p>
            </div>

            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword" class="form-label" data-lang-key="new_password_label">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label for="confirmNewPassword" class="form-label" data-lang-key="confirm_new_password_label">Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" name="confirmNewPassword" class="form-control" placeholder="••••••••" required>
                </div>
                <!-- Hidden input for the token, will be populated by JS from URL -->
                <input type="hidden" id="token" name="token">
                <button type="submit" class="btn btn-primary btn-block" data-lang-key="reset_password_btn">Reset Password <span class="loading-spinner" id="resetPasswordSpinner"></span></button>
            </form>

            <div id="resetPasswordMessage" class="mt-3 text-center"></div>
            <div class="auth-footer">
                <p><a href="/login.html" data-lang-key="back_to_login_link">Back to Login</a></p>
            </div>
        </main>
        
    <!-- Confirmation Modal -->
    <div id="footerPlaceholder"></div>

    <!-- Load JavaScript files -->
    <script src="/language/language.js"></script>
    <script src="/language/auth-page-translations.js"></script>
    <script src="/components.js"></script>
    <script src="/js/reset_password.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NHWNSKWN0N"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
     
      gtag('config', 'G-NHWNSKWN0N');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="reset_password_title">Reset Password - Hirly</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Styling -->
    <link rel="stylesheet" href="/styling/main.css">
    <!-- Page-specific CSS (MUST be loaded after global-rtl.css) -->
    <link rel="stylesheet" href="/styling/pages/page-auth.css">

    <!-- Custom CSS for the modal -->
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fefefe;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .modal-content h3 {
            margin-top: 0;
            color: #1a202c;
            font-size: 1.5rem;
        }

        .modal-content p {
            font-size: 1rem;
            color: #4a5568;
            margin-bottom: 20px;
        }

        .modal-content button {
            background-color: #4c51bf;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .modal-content button:hover {
            background-color: #434190;
        }
    </style>
</head>
<body class="auth-page-body">
    <!-- Header will be loaded by components.js -->
    <div id="headerPlaceholder"></div>

    <main class="auth-main">
        <div class="auth-container">
            <header class="auth-header">
                <h2 data-lang-key="reset_password_heading">Reset Your Password</h2>
                <p data-lang-key="reset_password_subtitle">Enter your new password below.</p>
            </header>

            <form id="resetPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="newPassword" data-lang-key="new_password_label">New Password</label>
                    <div class="auth-input-wrapper">
                        <input type="password" id="newPassword" class="auth-input" placeholder="••••••••" required>
                        <i class="fas fa-lock"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmNewPassword" data-lang-key="confirm_new_password_label">Confirm New Password</label>
                    <div class="auth-input-wrapper">
                        <input type="password" id="confirmNewPassword" class="auth-input" placeholder="••••••••" required>
                        <i class="fas fa-lock"></i>
                    </div>
                </div>

                <!-- Password Requirements Compact -->
                <div class="grid grid-cols-2 gap-2 pb-4">
                    <div id="req-length" class="text-[10px] py-1.5 px-3 border border-slate-100 rounded-xl flex items-center gap-2 text-slate-400 transition-all">
                        <i class="fas fa-check-circle text-[9px]"></i>
                        <span data-lang-key="password_req_length">8+ chars</span>
                    </div>
                    <div id="req-lowercase" class="text-[10px] py-1.5 px-3 border border-slate-100 rounded-xl flex items-center gap-2 text-slate-400 transition-all">
                        <i class="fas fa-check-circle text-[9px]"></i>
                        <span data-lang-key="password_req_lowercase">abc</span>
                    </div>
                    <div id="req-uppercase" class="text-[10px] py-1.5 px-3 border border-slate-100 rounded-xl flex items-center gap-2 text-slate-400 transition-all">
                        <i class="fas fa-check-circle text-[9px]"></i>
                        <span data-lang-key="password_req_uppercase">ABC</span>
                    </div>
                    <div id="req-number" class="text-[10px] py-1.5 px-3 border border-slate-100 rounded-xl flex items-center gap-2 text-slate-400 transition-all">
                        <i class="fas fa-check-circle text-[9px]"></i>
                        <span data-lang-key="password_req_number">123</span>
                    </div>
                </div>

                <!-- Hidden input for the token, will be populated by JS from URL -->
                <input type="hidden" id="token" name="token">
                <button type="submit" class="auth-btn-primary" data-lang-key="reset_password_btn">
                    <span>Reset Password</span>
                    <i class="fas fa-key"></i>
                    <span class="loading-spinner" id="resetPasswordSpinner"></span>
                </button>
            </form>

            <div id="resetPasswordMessage" class="mt-4 text-center" style="font-weight: 600; font-size: 0.9rem;"></div>
            
            <footer class="auth-footer">
                <a href="/login.html" class="auth-link" data-lang-key="back_to_login_link">Back to Login</a>
            </footer>
        </div>
    </main>
        
    <!-- Confirmation Modal -->
    <div id="footerPlaceholder"></div>

    <!-- Load JavaScript files -->
    <script src="/language/language.js"></script>
    <script src="/language/auth-page-translations.js"></script>
    <script src="/components.js"></script>
    <script src="/js/reset_password.js"></script>
</body>
</html>

<html lang="ar" dir="rtl" id="htmlTag">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="signup_title_main">Sign Up — Hirly</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hirly: {
                            50: '#f3f4ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            500: '#667eea',
                            600: '#764ba2',
                            700: '#5a67d8',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styling/main.css">
    <link rel="stylesheet" href="/styling/pages/page-auth.css">
</head>
<body class="auth-page-body">
    <div id="headerPlaceholder"></div>

    <main class="auth-main">
        <div class="signup-card-compact mx-auto">
            <!-- Simple Centered Header -->
            <div class="pt-10 px-8 text-center group">
                <!-- Logo with Clean Frame -->
                <div class="inline-flex items-center justify-center mb-10">
                    <div class="logo-frame-luxe">
                        <img src="https://ecxvfjceuynwtpjvmxpw.supabase.co/storage/v1/object/public/assets/logo.jpg" alt="Hirly" class="h-10 w-auto object-contain transition-transform group-hover:scale-105 duration-700">
                    </div>
                </div>

                <!-- Step States (The "Second one" kept as the primary indicator) -->
                <div class="flex justify-center items-center gap-3 mb-2">
                    <div class="step-indicator active" data-step="1"></div>
                    <div class="step-indicator" data-step="2"></div>
                    <div class="step-indicator" data-step="3"></div>
                </div>
                
                <!-- Hidden elements for JS compatibility -->
                <div id="progressBar" class="hidden"></div>
                <h1 id="signupTitle" class="hidden"></h1>
                <p id="signupSubtitle" class="hidden"></p>
            </div>

            <form id="signupForm" class="p-8 pt-8">
                <!-- Step 1: Role -->
                <div class="signup-step space-y-8" id="step1">
                    <div class="text-center space-y-2 mb-8">
                        <h2 class="text-xl font-black text-slate-900" data-lang-key="step_1_heading">Let's get started!</h2>
                        <p class="text-slate-500 text-xs font-medium" data-lang-key="step_1_description">Tell us what brings you to Hirly.</p>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <label class="user-type-card-compact group user-type-card-new" data-user-type="freelancer">
                            <input type="radio" name="initialUserType" value="freelancer" id="initialUserTypeFreelancer" class="hidden" required>
                            <div class="text-center">
                                <div class="icon-box-small">
                                    <i class="fas fa-user-tie"></i>
                                </div>
                                <h4 class="text-sm font-bold text-slate-800" data-lang-key="talent_card_title">Professional</h4>
                                <p class="text-[10px] text-slate-500 mt-1 leading-relaxed" data-lang-key="talent_card_desc">Showcase skills & find jobs.</p>
                            </div>
                        </label>

                        <label class="user-type-card-compact group user-type-card-new" data-user-type="employer">
                            <input type="radio" name="initialUserType" value="employer" id="initialUserTypeEmployer" class="hidden" required>
                            <div class="text-center">
                                <div class="icon-box-small">
                                    <i class="fas fa-building"></i>
                                </div>
                                <h4 class="text-sm font-bold text-slate-800" data-lang-key="employer_card_title">Employer</h4>
                                <p class="text-[10px] text-slate-500 mt-1 leading-relaxed" data-lang-key="employer_card_desc">Hire top talent easily.</p>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Step 2: Freelancer Journey -->
                <div class="signup-step hidden space-y-6" id="step2Freelancer">
                    <div id="statusSelection" class="grid grid-cols-3 gap-2">
                        <label class="status-card-compact status-card-new flex-col py-4 h-full items-center text-center" data-status="Working">
                            <input type="radio" name="currentStatus" value="Working" class="hidden" required>
                            <div class="icon-box-small !mb-2">
                                <i class="fas fa-briefcase"></i>
                            </div>
                            <span class="text-[10px] font-bold" data-lang-key="status_working">Working</span>
                        </label>
                        <label class="status-card-compact status-card-new flex-col py-4 h-full items-center text-center" data-status="Freelancing">
                            <input type="radio" name="currentStatus" value="Freelancing" class="hidden">
                            <div class="icon-box-small !mb-2">
                                <i class="fas fa-laptop-code"></i>
                            </div>
                            <span class="text-[10px] font-bold" data-lang-key="status_freelance">Freelancing</span>
                        </label>
                        <label class="status-card-compact status-card-new flex-col py-4 h-full items-center text-center" data-status="Student">
                            <input type="radio" name="currentStatus" value="Student" class="hidden">
                            <div class="icon-box-small !mb-2">
                                <i class="fas fa-graduation-cap"></i>
                            </div>
                            <span class="text-[10px] font-bold" data-lang-key="status_student">Student</span>
                        </label>
                    </div>

                    <!-- Student Discovery (Minimal) -->
                    <div id="studentFieldsContainer" class="hidden space-y-6 pt-6 border-t border-slate-50">
                        <!-- Student Status: University or School -->
                        <div class="space-y-3">
                            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1" data-lang-key="student_status_label">Student Status</label>
                            <div class="grid grid-cols-2 gap-3">
                                <label class="relative cursor-pointer group">
                                    <input type="radio" name="student_type" value="University" class="sr-only peer" checked>
                                    <div class="status-card-compact py-3 px-4 flex items-center gap-3 font-bold text-slate-500 border-2 border-slate-50 bg-slate-50/50 peer-checked:border-hirly-500 peer-checked:bg-white peer-checked:text-hirly-600 peer-checked:shadow-sm transition-all duration-300">
                                        <div class="w-8 h-8 rounded-lg bg-white border border-slate-100 flex items-center justify-center text-slate-400 peer-checked:group-[]:border-hirly-100 peer-checked:group-[]:text-hirly-500 transition-all">
                                            <i class="fas fa-university text-xs"></i>
                                        </div>
                                        <span class="text-xs" data-lang-key="university_option">University</span>
                                    </div>
                                </label>
                                <label class="relative cursor-pointer group">
                                    <input type="radio" name="student_type" value="School" class="sr-only peer">
                                    <div class="status-card-compact py-3 px-4 flex items-center gap-3 font-bold text-slate-500 border-2 border-slate-50 bg-slate-50/50 peer-checked:border-hirly-500 peer-checked:bg-white peer-checked:text-hirly-600 peer-checked:shadow-sm transition-all duration-300">
                                        <div class="w-8 h-8 rounded-lg bg-white border border-slate-100 flex items-center justify-center text-slate-400 peer-checked:group-[]:border-hirly-100 peer-checked:group-[]:text-hirly-500 transition-all">
                                            <i class="fas fa-school text-xs"></i>
                                        </div>
                                        <span class="text-xs" data-lang-key="school_option">School</span>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <!-- University Year -->
                        <div id="universityYearContainer" class="form-group">
                            <label data-lang-key="university_year_label">Which year?</label>
                            <div class="auth-input-wrapper">
                                <select id="universityYear" name="university_year" class="auth-input appearance-none">
                                    <option value="" data-lang-key="select_year_placeholder">Select Year</option>
                                    <option value="1" data-lang-key="year_1">1st Year</option>
                                    <option value="2" data-lang-key="year_2">2nd Year</option>
                                    <option value="3" data-lang-key="year_3">3rd Year</option>
                                    <option value="4" data-lang-key="year_4">4th Year</option>
                                    <option value="5+" data-lang-key="year_5_plus">5th Year+</option>
                                </select>
                                <i class="fas fa-calendar-check"></i>
                            </div>
                        </div>

                        <!-- School Grade -->
                        <div id="schoolGradeContainer" class="hidden form-group">
                            <label data-lang-key="school_grade_label">Which grade?</label>
                            <div class="auth-input-wrapper">
                                <select id="schoolGrade" name="school_grade" class="auth-input appearance-none">
                                    <option value="" data-lang-key="select_grade_placeholder">Select Grade</option>
                                    <option value="9" data-lang-key="grade_9">9th Grade</option>
                                    <option value="10" data-lang-key="grade_10">10th Grade</option>
                                    <option value="11" data-lang-key="grade_11">11th Grade</option>
                                    <option value="12" data-lang-key="grade_12">12th Grade (Tawjihi)</option>
                                </select>
                                <i class="fas fa-layer-group"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Current Profession (Only for Working/Freelancing) -->
                    <div id="professionDiscovery" class="hidden space-y-4 pt-4 border-t border-slate-50">
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-3 block" data-lang-key="journey_category_title">Field of Work</label>
                            <div id="categoriesScrollContainer" class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide">
                                <!-- Populated by signup.js -->
                            </div>
                        </div>

                        <div id="professionsDropdownContainer" class="hidden">
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 block" data-lang-key="journey_profession_title_specific">Specific Profession</label>
                            <div class="relative">
                                <button type="button" id="professionsToggleButton" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl py-3 px-4 flex items-center justify-between text-sm font-bold text-slate-700 transition-all">
                                    <span id="selectedProfessionsDisplay" data-lang-key="select_profession_placeholder">Select Profession</span>
                                    <i class="fas fa-chevron-down text-slate-400 transition-transform"></i>
                                </button>
                                <div id="professionsList" class="hidden absolute z-50 w-full mt-2 bg-white border border-slate-100 rounded-xl shadow-xl max-h-48 overflow-y-auto p-2">
                                    <div id="professionsCheckboxes" class="space-y-1"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Interested Professions (Everyone) -->
                    <div id="interestsSection" class="hidden space-y-4 pt-4 border-t border-slate-50">
                        <div class="flex items-center justify-between">
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider" data-lang-key="interested_in_others_label">Interested in other professions?</label>
                            <span class="text-[9px] font-bold text-slate-400 uppercase" data-lang-key="max_5_professions">Max 5</span>
                        </div>
                        
                        <!-- Interest Categories Scroll -->
                        <div id="interestCategoriesScrollContainer" class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide">
                            <!-- Populated by signup.js -->
                        </div>

                        <!-- Interest Specific Professions Dropdown (Multi-select) -->
                        <div id="interestProfessionsDropdownContainer" class="hidden opacity-0 translate-y-2 transition-all duration-300">
                            <div class="relative">
                                <button type="button" id="interestProfessionsToggleButton" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl py-3 px-4 flex items-center justify-between text-sm font-bold text-slate-700 transition-all">
                                    <span id="selectedInterestsDisplay" data-lang-key="interested_professions_placeholder">Select professions...</span>
                                    <i class="fas fa-chevron-down text-slate-400 transition-transform"></i>
                                </button>
                                <div id="interestProfessionsList" class="hidden absolute z-50 w-full mt-2 bg-white border border-slate-100 rounded-xl shadow-xl max-h-48 overflow-y-auto p-2">
                                    <div id="interestProfessionsCheckboxes" class="space-y-1"></div>
                                </div>
                            </div>
                        </div>

                        <div id="selectedInterestsTags" class="flex flex-wrap gap-2"></div>
                    </div>
                </div>

                <!-- Step 2: Employer Journey -->
                <div class="signup-step hidden space-y-6" id="step2Employer">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <label class="user-type-card-compact group" data-employer-type="individual">
                            <input type="radio" name="employerType" value="individual" id="employerTypeIndividual" class="hidden" required>
                            <div class="text-center">
                                <div class="icon-box-small">
                                    <i class="fas fa-user"></i>
                                </div>
                                <h4 class="text-sm font-bold text-slate-800" data-lang-key="employer_type_individual_radio">Individual</h4>
                                <p class="text-[10px] text-slate-500 mt-1 leading-relaxed" data-lang-key="employer_type_individual_desc">For personal projects.</p>
                            </div>
                        </label>
                        <label class="user-type-card-compact group" data-employer-type="company">
                            <input type="radio" name="employerType" value="company" id="employerTypeCompany" class="hidden" required>
                            <div class="text-center">
                                <div class="icon-box-small">
                                    <i class="fas fa-building"></i>
                                </div>
                                <h4 class="text-sm font-bold text-slate-800" data-lang-key="employer_type_company_radio">Company</h4>
                                <p class="text-[10px] text-slate-500 mt-1 leading-relaxed" data-lang-key="employer_type_company_desc">For professional teams.</p>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Step 3: Personal Info -->
                <div class="signup-step hidden space-y-4" id="step3Personal">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div class="form-group">
                            <label data-lang-key="first_name_label">First Name</label>
                            <div class="auth-input-wrapper">
                                <input type="text" id="firstName" class="auth-input" data-lang-key="first_name_placeholder" placeholder="First Name" required>
                                <i class="fas fa-user"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label data-lang-key="last_name_label">Last Name</label>
                            <div class="auth-input-wrapper">
                                <input type="text" id="lastName" class="auth-input" data-lang-key="last_name_placeholder" placeholder="Last Name" required>
                                <i class="fas fa-user"></i>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label data-lang-key="email_address_label">Email Address</label>
                        <div class="auth-input-wrapper">
                            <input type="email" id="email" class="auth-input" data-lang-key="email_placeholder" placeholder="email@example.com" required>
                            <i class="fas fa-envelope"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label data-lang-key="confirm_email_label">Confirm Email Address</label>
                        <div class="auth-input-wrapper">
                            <input type="email" id="confirmEmail" class="auth-input" data-lang-key="confirm_email_placeholder" placeholder="Re-type your email" required>
                            <i class="fas fa-envelope-open-text"></i>
                        </div>
                        <p class="text-[9px] text-hirly-500 mt-2 font-medium flex items-center gap-1.5" data-lang-key="email_verification_hint">
                            <i class="fas fa-info-circle"></i>
                            Please ensure your email is correct so we can verify your account.
                        </p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div class="form-group">
                            <label data-lang-key="select_country_code">Country Code</label>
                            <div class="auth-input-wrapper">
                                <select id="countryCode" class="auth-input appearance-none" required></select>
                                <i class="fas fa-globe"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label data-lang-key="phone_number_label">Phone Number</label>
                            <div class="auth-input-wrapper">
                                <input type="tel" id="phone" class="auth-input" data-lang-key="phone_placeholder" placeholder="599 123 456" required>
                                <i class="fas fa-phone"></i>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div class="form-group">
                            <label data-lang-key="country_label">Country</label>
                            <div class="auth-input-wrapper">
                                <select id="country" class="auth-input appearance-none" required></select>
                                <i class="fas fa-globe-africa"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label data-lang-key="city_label">City</label>
                            <div class="auth-input-wrapper">
                                <select id="city" class="auth-input appearance-none" required></select>
                                <i class="fas fa-map-marker-alt"></i>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div class="form-group">
                            <label data-lang-key="gender_label">Gender</label>
                            <div class="auth-input-wrapper">
                                <select id="gender" class="auth-input appearance-none" required>
                                    <option value="" disabled selected data-lang-key="select_gender_placeholder">Select Gender</option>
                                    <option value="male" data-lang-key="gender_male">Male</option>
                                    <option value="female" data-lang-key="gender_female">Female</option>
                                </select>
                                <i class="fas fa-venus-mars"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label data-lang-key="birthdate_label">Birth Date</label>
                            <div class="auth-input-wrapper">
                                <input type="date" id="birthdate" class="auth-input" required>
                                <i class="fas fa-calendar-alt"></i>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div class="form-group">
                            <label data-lang-key="password_label">Password</label>
                            <div class="auth-input-wrapper">
                                <input type="password" id="password" class="auth-input" data-lang-key="password_placeholder" placeholder="Create a password" required>
                                <i class="fas fa-lock"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label data-lang-key="confirm_password_label">Confirm Password</label>
                            <div class="auth-input-wrapper">
                                <input type="password" id="confirmPassword" class="auth-input" data-lang-key="confirm_password_placeholder" placeholder="Confirm password" required>
                                <i class="fas fa-shield-alt"></i>
                            </div>
                        </div>
                    </div>
                    <!-- Password Requirements Compact -->
                    <div class="grid grid-cols-2 gap-2 pb-2">
                        <div id="req-length" class="text-[9px] py-1 px-2 border border-slate-100 rounded-lg flex items-center gap-1 text-slate-400 transition-all">
                            <i class="fas fa-check-circle text-[8px]"></i>
                            <span data-lang-key="password_req_length">8+ chars</span>
                        </div>
                        <div id="req-lowercase" class="text-[9px] py-1 px-2 border border-slate-100 rounded-lg flex items-center gap-1 text-slate-400 transition-all">
                            <i class="fas fa-check-circle text-[8px]"></i>
                            <span data-lang-key="password_req_lowercase">abc</span>
                        </div>
                        <div id="req-uppercase" class="text-[9px] py-1 px-2 border border-slate-100 rounded-lg flex items-center gap-1 text-slate-400 transition-all">
                            <i class="fas fa-check-circle text-[8px]"></i>
                            <span data-lang-key="password_req_uppercase">ABC</span>
                        </div>
                        <div id="req-number" class="text-[9px] py-1 px-2 border border-slate-100 rounded-lg flex items-center gap-1 text-slate-400 transition-all">
                            <i class="fas fa-check-circle text-[8px]"></i>
                            <span data-lang-key="password_req_number">123</span>
                        </div>
                    </div>
                    <div class="pt-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="terms" class="w-4 h-4 rounded border-slate-200 text-hirly-500 focus:ring-hirly-500" required>
                            <span class="text-[10px] text-slate-500" data-lang-key="terms_checkbox_label">I agree to Terms & Privacy</span>
                        </label>
                    </div>
                </div>

                <!-- Step 3: Company Details -->
                <div class="signup-step hidden space-y-4" id="step3Company">
                    <div class="form-group">
                        <label data-lang-key="company_name_label">Company Name</label>
                        <div class="auth-input-wrapper">
                            <input type="text" id="companyName" class="auth-input" data-lang-key="company_name_placeholder" placeholder="Your Company Name" required>
                            <i class="fas fa-building"></i>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div class="form-group">
                            <label data-lang-key="company_email_label">Business Email</label>
                            <div class="auth-input-wrapper">
                                <input type="email" id="companyEmail" class="auth-input" data-lang-key="company_email_placeholder" placeholder="business@company.com" required>
                                <i class="fas fa-envelope"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label data-lang-key="confirm_email_label">Confirm Email Address</label>
                            <div class="auth-input-wrapper">
                                <input type="email" id="confirmCompanyEmail" class="auth-input" data-lang-key="confirm_email_placeholder" placeholder="Re-type your email" required>
                                <i class="fas fa-envelope-open-text"></i>
                            </div>
                        </div>
                    </div>
                    <p class="text-[9px] text-hirly-500 mt-2 font-medium flex items-center gap-1.5" data-lang-key="email_verification_hint">
                        <i class="fas fa-info-circle"></i>
                        Please ensure your email is correct so we can verify your account.
                    </p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div class="form-group">
                            <label data-lang-key="select_country_code">Country Code</label>
                            <div class="auth-input-wrapper">
                                <select id="companyCountryCode" class="auth-input appearance-none" required></select>
                                <i class="fas fa-globe"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label data-lang-key="company_phone_label">Phone Number</label>
                            <div class="auth-input-wrapper">
                                <input type="tel" id="companyPhone" class="auth-input" data-lang-key="company_phone_placeholder" placeholder="599 123 456" required>
                                <i class="fas fa-phone"></i>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label data-lang-key="company_address_label">Company Address</label>
                        <div class="auth-input-wrapper">
                            <input type="text" id="address" class="auth-input" data-lang-key="company_address_placeholder" placeholder="Office address, City, Country" required>
                            <i class="fas fa-map-marker-alt"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label data-lang-key="company_category_label">Industry</label>
                        <div class="relative">
                            <button type="button" id="companyCategoriesToggleButton" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl py-3 px-4 flex items-center justify-between text-sm font-bold text-slate-700">
                                <span id="companySelectedCategoriesDisplay" data-lang-key="select_industry_category_display">Select Industry</span>
                                <i class="fas fa-chevron-down text-slate-400 transition-transform"></i>
                            </button>
                            <div id="companyCategoriesList" class="hidden absolute z-50 w-full mt-2 bg-white border border-slate-100 rounded-xl shadow-xl max-h-48 overflow-y-auto p-2">
                                <div id="companyCategoriesCheckboxes" class="space-y-1"></div>
                            </div>
                            <input type="hidden" id="companyCategoryHidden">
                        </div>
                    </div>
                    <div class="form-group">
                        <label data-lang-key="company_description_label">Company Bio</label>
                        <textarea id="companyDescription" class="auth-input min-h-[80px] py-3" data-lang-key="company_description_placeholder" placeholder="Briefly describe your company..."></textarea>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div class="form-group">
                            <label data-lang-key="password_label">Password</label>
                            <div class="auth-input-wrapper">
                                <input type="password" id="companyPassword" class="auth-input" data-lang-key="password_placeholder" placeholder="Create a password" required>
                                <i class="fas fa-lock"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label data-lang-key="confirm_password_label">Confirm Password</label>
                            <div class="auth-input-wrapper">
                                <input type="password" id="confirmCompanyPassword" class="auth-input" data-lang-key="confirm_password_placeholder" placeholder="Confirm password" required>
                                <i class="fas fa-shield-alt"></i>
                            </div>
                        </div>
                    </div>
                    <!-- Password Requirements Company Compact -->
                    <div class="grid grid-cols-2 gap-2 pb-2">
                        <div id="req-length-company" class="text-[9px] py-1 px-2 border border-slate-100 rounded-lg flex items-center gap-1 text-slate-400 transition-all">
                            <i class="fas fa-check-circle text-[8px]"></i>
                            <span data-lang-key="password_req_length">8+ chars</span>
                        </div>
                        <div id="req-lowercase-company" class="text-[9px] py-1 px-2 border border-slate-100 rounded-lg flex items-center gap-1 text-slate-400 transition-all">
                            <i class="fas fa-check-circle text-[8px]"></i>
                            <span data-lang-key="password_req_lowercase">abc</span>
                        </div>
                        <div id="req-uppercase-company" class="text-[9px] py-1 px-2 border border-slate-100 rounded-lg flex items-center gap-1 text-slate-400 transition-all">
                            <i class="fas fa-check-circle text-[8px]"></i>
                            <span data-lang-key="password_req_uppercase">ABC</span>
                        </div>
                        <div id="req-number-company" class="text-[9px] py-1 px-2 border border-slate-100 rounded-lg flex items-center gap-1 text-slate-400 transition-all">
                            <i class="fas fa-check-circle text-[8px]"></i>
                            <span data-lang-key="password_req_number">123</span>
                        </div>
                    </div>
                    <div class="pt-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="companyTerms" class="w-4 h-4 rounded border-slate-200 text-hirly-500 focus:ring-hirly-500" required>
                            <span class="text-[10px] text-slate-500" data-lang-key="terms_checkbox_label">I agree to Terms & Privacy</span>
                        </label>
                    </div>
                </div>

                <!-- Navigation -->
                <div class="flex items-center justify-between gap-4 mt-8">
                    <button type="button" id="prevBtn" class="btn-secondary-compact hidden">
                        <i class="fas fa-arrow-left rtl:rotate-180"></i>
                        <span data-lang-key="previous_button">Back</span>
                    </button>
                    <div class="flex-grow"></div>
                    <button type="button" id="nextBtn" class="btn-primary-compact">
                        <span data-lang-key="next_button">Continue</span>
                        <div id="nextSpinner" class="hidden animate-spin w-4 h-4 border-2 border-white border-t-transparent rounded-full"></div>
                        <i class="fas fa-arrow-right rtl:rotate-180"></i>
                    </button>
                    <button type="submit" id="submitBtn" class="btn-primary-compact hidden">
                        <span data-lang-key="create_account_button">Create Account</span>
                        <div id="submitSpinner" class="hidden animate-spin w-4 h-4 border-2 border-white border-t-transparent rounded-full"></div>
                    </button>
                </div>
            </form>

            <!-- Error Message Container -->
            <div id="signupMessage" class="px-8 pb-4 hidden"></div>

            <div class="text-center pb-8">
                <p class="text-[10px] text-slate-500 font-medium">
                    <span data-lang-key="already_have_account">Already have an account?</span>
                    <a href="/login.html" class="text-hirly-500 font-bold hover:underline ml-1" data-lang-key="login_link">Log In</a>
                </p>
            </div>
        </div>
    </main>

    <div id="footerPlaceholder"></div>

    <script src="/language/language.js"></script>
    <script src="/language/auth-page-translations.js"></script>
    <script src="/language/categories-professions-translations.js"></script>
    <script src="/language/cities-translations.js"></script>
    <script src="/auth.js" defer></script>
    <script src="/components.js" defer></script>
    <script src="/js/signup.js" defer></script>
</body>
</html>

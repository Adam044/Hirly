    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="{{USER_DESCRIPTION}}">

    <meta property="twitter:title" content="{{USER_NAME}} | Hirly Professional">
    <meta property="twitter:description" content="{{USER_DESCRIPTION}}">
    <meta property="twitter:image" content="{{USER_IMAGE}}">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hirly: {
                            50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd',
                            400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9',

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styling/main.css">
    <link rel="stylesheet" href="/styling/pages/page-profile.css">
    <link rel="stylesheet" href="/styling/components/modals.css">

    <style>
        body { font-family: 'Inter', 'Noto Sans Arabic', sans-serif; }
    </style>

    <script src="/language/language.js"></script>
    <script src="/language/profile-translations.js"></script>
    <script src="/language/categories-professions-translations.js"></script>
    <script src="/language/cities-translations.js"></script>
</head>
<body class="bg-slate-50 profile-page-wrapper selection:bg-hirly-500/30 selection:text-white">
    <div id="headerPlaceholder"></div>
    
    <!-- Background Elements -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-hirly-500/5 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-500/5 rounded-full blur-[120px]"></div>
    </div>
    
    <!-- Loading Overlay -->
    <div id="pageLoadingOverlay" class="loading-overlay show fixed inset-0 z-[9999] bg-white items-center justify-center transition-opacity duration-700">
        <div class="flex flex-col items-center gap-8">
            <div class="relative w-20 h-20">
                <div class="absolute inset-0 border-4 border-hirly-100 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-hirly-500 border-t-transparent rounded-full animate-spin"></div>
            </div>
            <span class="text-hirly-600 font-bold tracking-widest uppercase text-xs" data-lang-key="loading"></span>
        </div>
    </div>

    <main class="container mx-auto px-4 md:px-6 max-w-6xl relative z-10 pt-8 md:pt-12">
        <!-- Profile Header -->
        <div class="space-y-8">
            <!-- Main Content Column (Full Width) -->
            <div class="space-y-8 max-w-5xl mx-auto">
                <header class="luxe-card no-hover p-6 md:p-12 relative overflow-hidden group bg-gradient-to-br from-white via-slate-50 to-hirly-50/20 border-hirly-100/50">
                    <div class="absolute top-0 right-0 w-96 h-96 bg-hirly-500/5 rounded-full blur-3xl -mr-48 -mt-48 transition-transform duration-700 group-hover:scale-110"></div>
                    <div class="absolute bottom-0 left-0 w-64 h-64 bg-blue-500/5 rounded-full blur-3xl -ml-32 -mb-32"></div>
                    
                    <div class="relative z-10 flex flex-col md:flex-row gap-8 md:gap-16 items-center">
                            <!-- Avatar Section -->
                            <div class="avatar-wrapper shrink-0 relative">
                                <div class="absolute inset-0 bg-hirly-500/20 blur-2xl rounded-full transform scale-90 group-hover:scale-100 transition-transform duration-500"></div>
                                <div id="profileAvatar" class="relative z-10 w-32 h-32 md:w-56 md:h-56 bg-white rounded-[2.5rem] flex items-center justify-center text-5xl md:text-7xl font-black text-slate-300 overflow-hidden shadow-2xl shadow-hirly-100/50 border-[6px] border-white transform transition-transform duration-500 hover:rotate-2">
                                    <!-- JS Inject -->
                                </div>
                                <div id="premiumBadge" class="absolute -bottom-3 -right-3 z-20 bg-gradient-to-r from-amber-300 to-amber-500 text-white px-4 py-1.5 rounded-full text-xs font-black shadow-lg border-2 border-white hidden uppercase tracking-widest transform hover:scale-105 transition-transform" data-lang-key="premium">
                                </div>
                            </div>

                            <!-- Info Section -->
                            <div class="space-y-6 w-full flex-1 min-w-0 pt-2 text-center md:text-center">
                                <div class="space-y-4">
                                    <h1 id="profileName" class="text-3xl md:text-5xl lg:text-6xl font-black text-slate-900 tracking-tight break-words leading-tight bg-clip-text text-transparent bg-gradient-to-r from-slate-900 to-slate-700 pb-2">...</h1>
                                    
                                    <div class="flex flex-wrap justify-center items-center gap-3 text-base md:text-lg">
                                        <!-- Profession/Status Tag -->
                                        <p id="profileProfession" class="flex items-center gap-2 font-bold text-hirly-600 px-5 py-2.5 bg-hirly-50 border border-hirly-100 rounded-full shadow-sm hover:shadow-md transition-all hidden"></p>
                                        
                                        <!-- Degree Tag -->
                                        <div id="profileDegreeContainer" class="flex items-center gap-2 px-5 py-2.5 bg-white text-slate-700 rounded-full font-bold border border-slate-200 shadow-sm hover:shadow-md transition-all text-sm hidden">
                                            <i class="fas fa-graduation-cap text-hirly-500 text-lg"></i>
                                            <span id="profileDegree"></span>
                                        </div>

                                        <!-- Institution Tag (New) -->
                                        <div id="profileInstitutionContainer" class="flex items-center gap-2 px-5 py-2.5 bg-white text-slate-700 rounded-full font-bold border border-slate-200 shadow-sm hover:shadow-md transition-all text-sm hidden">
                                            <i class="fas fa-university text-hirly-500 text-lg"></i>
                                            <span id="profileInstitution"></span>
                                        </div>

                                        <!-- Location Tag -->
                                        <div class="flex items-center gap-2 px-5 py-2.5 bg-white text-slate-600 rounded-full font-bold border border-slate-200 shadow-sm hover:shadow-md transition-all text-sm" id="profileLocationContainer">
                                            <i class="fas fa-map-marker-alt text-hirly-500 text-lg"></i>
                                            <span id="profileLocation"></span>
                                        </div>

                                        <!-- Rating Tag -->
                                        <div id="ratingContainer" class="flex items-center gap-2 px-5 py-2.5 bg-white text-slate-900 rounded-full font-bold border border-slate-200 shadow-sm hover:shadow-md transition-all text-sm hidden">
                                            <i class="fas fa-star text-amber-400 text-lg"></i>
                                            <span id="averageRatingValue"></span>
                                            <span id="reviewsCountParenthesis" class="text-slate-400 text-xs font-medium"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                    </div>
                </header>

                <!-- About -->
                <section id="aboutMeSection" class="luxe-card no-hover p-6 md:p-12 space-y-8">
                    <div class="flex flex-col items-center justify-center gap-3 group cursor-default">
                        <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-slate-900 to-slate-700" data-lang-key="about_me_title"></h2>
                        <div class="w-16 h-1.5 bg-gradient-to-r from-hirly-200 to-hirly-400 rounded-full group-hover:w-24 transition-all duration-300"></div>
                    </div>
                    <div id="profileBio" class="text-slate-600 leading-relaxed text-lg font-medium text-center max-w-3xl mx-auto">
                        <!-- JS Inject -->
                    </div>
                </section>

                <!-- What I'm good at (Skills) -->
                <section id="skillsSection" class="luxe-card no-hover p-6 md:p-12 space-y-10">
                    <div class="flex items-center justify-center gap-4">
                        <h2 class="text-3xl font-black text-slate-900" data-lang-key="skills_section_title"></h2>
                        <div class="w-10 h-10 flex items-center justify-center bg-amber-50 rounded-full text-amber-400 shadow-sm border border-amber-100">
                            <i class="fas fa-bolt text-lg"></i>
                        </div>
                    </div>
                    <div id="skillsContainer" class="flex flex-wrap justify-center gap-3">
                        <!-- JS Inject -->
                    </div>
                </section>

                <!-- Willing to Work In These Fields (Interested Professions) -->
                <section id="interestedProfessionsSection" class="luxe-card no-hover p-6 md:p-12 space-y-10 hidden">
                    <div class="flex items-center justify-center gap-4">
                        <h2 class="text-3xl font-black text-slate-900" data-lang-key="willing_to_work_in_fields"></h2>
                        <div class="w-10 h-10 flex items-center justify-center bg-emerald-50 rounded-full text-emerald-400 shadow-sm border border-emerald-100">
                            <i class="fas fa-briefcase text-lg"></i>
                        </div>
                    </div>
                    <div id="interestedProfessionsContainer" class="flex flex-wrap justify-center gap-3">
                        <!-- JS Inject -->
                    </div>
                </section>

                <!-- Services -->
                <section id="servicesSection" class="space-y-8 hidden">
                    <div class="px-4 flex flex-col items-center justify-center gap-3">
                        <h2 class="text-3xl font-black text-slate-900" data-lang-key="services_section_title"></h2>
                        <span class="px-4 py-1 bg-slate-100 text-slate-400 text-[10px] font-black uppercase rounded-full tracking-widest" data-lang-key="services_section_title"></span>
                    </div>
                    <div id="servicesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- JS Inject -->
                    </div>
                </section>

                <!-- CV Section (Simplified) -->
                <section id="cvSection" class="hidden">
                    <div class="luxe-card p-6 md:p-10 bg-slate-50 border-slate-100">
                        <div class="flex flex-col items-center justify-center gap-8 text-center">
                            <div class="flex flex-col items-center gap-4">
                                <div class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center text-hirly-500 shadow-sm border border-slate-100 text-2xl">
                                    <i class="fas fa-file-pdf"></i>
                                </div>
                                <h2 class="text-3xl font-black text-slate-900 tracking-tight" data-lang-key="curriculum_vitae_cv"></h2>
                            </div>
                            <div id="cvDisplay" class="shrink-0 w-full md:w-auto flex justify-center">
                                <!-- JS Inject -->
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Education -->
                <section id="profileEducation" class="space-y-8 hidden">
                    <div class="px-4 flex items-center justify-center gap-4">
                        <h2 class="text-3xl font-black text-slate-900" data-lang-key="education_section_title"></h2>
                        <i class="fas fa-graduation-cap text-slate-200 text-3xl"></i>
                    </div>
                    <div id="educationContent" class="grid grid-cols-1 gap-6">
                        <!-- JS Inject -->
                    </div>
                </section>


            </div>

            <!-- Right Sidebar Column -->
            <aside class="lg:col-span-4 space-y-8">
                <div class="sticky-sidebar space-y-8">
                    <!-- Sidebar Actions Removed as per user request to stick to one CTA section -->
                </div>
            </aside>
        </div>

        <!-- CTA Section -->
        <section id="finalActionSection" class="luxe-card p-6 md:p-20 text-center space-y-10 relative border-hirly-100 bg-gradient-to-br from-white via-white to-hirly-50/30 mt-12 mb-12">
            <div class="absolute top-0 right-0 w-64 h-64 bg-hirly-500/5 rounded-full blur-3xl -mr-32 -mt-32"></div>
            <div class="absolute bottom-0 left-0 w-64 h-64 bg-blue-500/5 rounded-full blur-3xl -ml-32 -mb-32"></div>
            
            <div class="relative z-10 space-y-8">
                <div class="space-y-4">
                    <h2 class="text-3xl md:text-5xl font-black text-slate-900 leading-tight tracking-tight" data-lang-key="work_together_title"></h2>
                    <p class="text-slate-500 text-lg md:text-xl max-w-2xl mx-auto font-medium" data-lang-key="work_together_subtitle"></p>
                </div>
                
                <div class="flex flex-col md:flex-row items-center justify-center gap-4 pt-4">
                    <button id="ctaOfferBtn" class="luxe-btn-secondary px-8 py-4 text-base w-full md:w-auto">
                        <i class="fas fa-briefcase"></i>
                        <span data-lang-key="send_an_offer"></span>
                    </button>
                    <button id="ctaContactBtn" class="luxe-btn-primary px-8 py-4 text-base w-full md:w-auto shadow-xl shadow-hirly-200">
                        <i class="fas fa-comment-alt"></i>
                        <span data-lang-key="contact_me"></span>
                    </button>
                    <button id="ctaShareBtn" class="luxe-btn-secondary px-8 py-4 text-base w-full md:w-auto">
                        <i class="fas fa-share-nodes"></i>
                        <span data-lang-key="share_profile_btn"></span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Reviews (Moved to End as requested) -->
        <!-- Reviews Section -->
        <section id="reviewsSection" class="space-y-12 hidden mb-24 relative">
            <!-- Decorative Element -->
            <div class="absolute top-0 right-0 w-64 h-64 bg-amber-400/5 rounded-full blur-[100px] -z-10"></div>
            
            <div class="px-4 flex flex-col md:flex-row items-center justify-between gap-6 max-w-5xl mx-auto">
                <div class="flex flex-col items-center md:items-start gap-2">
                    <div class="flex items-center gap-3">
                        <h2 class="text-3xl font-black text-slate-900 tracking-tight" data-lang-key="reviews_section_title"></h2>
                        <span class="px-3 py-1 bg-amber-50 text-amber-600 text-xs font-black rounded-full border border-amber-100" id="reviewsCount">0</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="flex items-center text-amber-400 text-[10px]">
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                        </div>
                        <span id="reviewsCountParenthesis" class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em]"></span>
                    </div>
                </div>
                
                <button id="leaveReviewBtn" class="luxe-btn-primary px-8 py-4 text-sm shadow-xl shadow-hirly-100 group">
                    <i class="fas fa-plus-circle group-hover:rotate-90 transition-transform duration-300"></i>
                    <span data-lang-key="leave_review"></span>
                </button>
            </div>

            <div id="reviewsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-5xl mx-auto px-4">
                <!-- JS Inject -->
            </div>
        </section>

        <!-- Footer -->
        <footer class="py-12 border-t border-slate-200 text-center">
            <p class="text-slate-400 text-[10px] font-black tracking-[0.4em] uppercase">
                <span>Powered by</span>
                <a href="/" class="text-[#0f172a] underline decoration-2 decoration-hirly-500 underline-offset-4 hover:text-hirly-600 transition-colors">Hirly</a>
            </p>
        </footer>
    </main>

    <!-- Mobile Sticky Actions Removed -->

    <!-- Unified Contact Modal -->
    <div id="contactModal" class="modal-overlay">
        <div class="luxe-card max-w-lg w-full p-8 animate-fade-up">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-blue-500 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-blue-100">
                        <i class="fas fa-address-card text-2xl"></i>
                    </div>
                    <div>
                        <h2 class="text-2xl font-black text-slate-900 tracking-tight" data-lang-key="contact_me"></h2>
                        <p class="text-slate-500 font-medium text-sm" data-lang-key="contact_modal_subtitle">Get in touch directly</p>
                    </div>
                </div>
                <button id="closeContactModalBtn" class="w-12 h-12 flex items-center justify-center rounded-2xl bg-slate-100 text-slate-400 hover:bg-rose-50 hover:text-rose-500 transition-all border border-slate-200">
                    <i class="fas fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="space-y-4">
                <a id="modalCallBtn" href="#" class="group flex items-center gap-6 p-6 bg-slate-50 rounded-3xl border border-slate-100 hover:border-blue-200 hover:bg-blue-50/30 transition-all duration-300">
                    <div class="w-14 h-14 rounded-2xl bg-white flex items-center justify-center text-blue-500 group-hover:bg-blue-500 group-hover:text-white transition-all duration-300 shadow-sm border border-slate-100">
                        <i class="fas fa-phone-flip text-xl"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1" data-lang-key="call"></span>
                        <span id="modalPhoneNumber" class="text-slate-900 font-bold text-lg" dir="ltr">...</span>
                    </div>
                </a>

                <a id="modalEmailBtn" href="#" class="group flex items-center gap-6 p-6 bg-slate-50 rounded-3xl border border-slate-100 hover:border-blue-200 hover:bg-blue-50/30 transition-all duration-300">
                    <div class="w-14 h-14 rounded-2xl bg-white flex items-center justify-center text-blue-500 group-hover:bg-blue-500 group-hover:text-white transition-all duration-300 shadow-sm border border-slate-100">
                        <i class="fas fa-envelope text-xl"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1" data-lang-key="email"></span>
                        <span id="modalEmailAddress" class="text-slate-900 font-bold text-lg break-all">...</span>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <!-- Employer Login Modal -->
    <div id="employerLoginModal" class="modal-overlay">
        <div class="luxe-card max-w-md w-full p-8 animate-fade-up">
            <!-- Header -->
            <div class="flex flex-col items-center gap-4 text-center mb-8">
                 <div class="w-16 h-16 bg-hirly-500 rounded-3xl flex items-center justify-center text-white shadow-xl shadow-hirly-200">
                    <i class="fas fa-lock text-3xl"></i>
                </div>
                <div>
                    <h2 class="text-2xl font-black text-slate-900 tracking-tight" data-lang-key="employer_access_required"></h2>
                    <p class="text-slate-500 font-medium mt-2 leading-relaxed" data-lang-key="employer_login_message"></p>
                </div>
            </div>

            <!-- Buttons -->
            <div class="flex gap-4">
                <a href="/login" class="flex-1 py-4 bg-hirly-600 hover:bg-hirly-700 text-white font-black rounded-2xl shadow-lg shadow-hirly-200 transition-all hover:-translate-y-0.5 text-center flex items-center justify-center gap-2">
                     <i class="fas fa-sign-in-alt"></i>
                     <span data-lang-key="login">Login</span>
                </a>
                <button id="closeEmployerLoginModalBtn" class="flex-1 py-4 bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold rounded-2xl transition-all" data-lang-key="cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div id="shareProfileModal" class="modal-overlay">
        <div class="luxe-card max-w-lg w-full p-8 animate-fade-up">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-emerald-500 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-emerald-100">
                        <i class="fas fa-share-nodes text-2xl"></i>
                    </div>
                    <div>
                        <h2 class="text-2xl font-black text-slate-900 tracking-tight" data-lang-key="share_profile_title">Share Profile</h2>
                        <p class="text-slate-500 font-medium text-sm" data-lang-key="share_profile_subtitle">Share this profile with others</p>
                    </div>
                </div>
                <button id="closeShareModalBtn" class="w-12 h-12 flex items-center justify-center rounded-2xl bg-slate-100 text-slate-400 hover:bg-rose-50 hover:text-rose-500 transition-all border border-slate-200">
                    <i class="fas fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="space-y-6">
                <!-- Copy Link -->
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex items-center gap-3 overflow-hidden">
                    <input type="text" id="profileLinkInput" class="bg-transparent border-none text-slate-600 font-medium flex-1 text-sm focus:ring-0 min-w-0" readonly>
                    <button id="copyLinkBtn" class="bg-white text-slate-900 font-bold px-4 py-2 rounded-xl text-xs shadow-sm border border-slate-100 hover:bg-emerald-50 hover:text-emerald-600 transition-all flex items-center gap-2 shrink-0 whitespace-nowrap">
                        <i class="fas fa-copy"></i>
                        <span data-lang-key="copy_btn">Copy</span>
                    </button>
                </div>
                <div id="copySuccessMsg" class="hidden text-center">
                    <span class="text-emerald-500 text-xs font-bold bg-emerald-50 px-3 py-1 rounded-full border border-emerald-100">
                        <i class="fas fa-check mr-1"></i> <span data-lang-key="link_copied">Link Copied!</span>
                    </span>
                </div>

                <!-- Social Share -->
                <div class="grid grid-cols-4 gap-3">
                    <button id="shareWhatsAppBtn" class="flex flex-col items-center gap-2 p-3 rounded-2xl hover:bg-emerald-50 transition-all group">
                        <div class="w-12 h-12 bg-[#25D366] text-white rounded-xl flex items-center justify-center text-xl shadow-lg shadow-[#25D366]/20 group-hover:scale-110 transition-transform">
                            <i class="fab fa-whatsapp"></i>
                        </div>
                        <span class="text-[10px] font-bold text-slate-500">WhatsApp</span>
                    </button>
                    <button id="shareFacebookBtn" class="flex flex-col items-center gap-2 p-3 rounded-2xl hover:bg-blue-50 transition-all group">
                        <div class="w-12 h-12 bg-[#1877F2] text-white rounded-xl flex items-center justify-center text-xl shadow-lg shadow-[#1877F2]/20 group-hover:scale-110 transition-transform">
                            <i class="fab fa-facebook-f"></i>
                        </div>
                        <span class="text-[10px] font-bold text-slate-500">Facebook</span>
                    </button>
                    <button id="shareMessengerBtn" class="flex flex-col items-center gap-2 p-3 rounded-2xl hover:bg-blue-50 transition-all group">
                        <div class="w-12 h-12 bg-gradient-to-tr from-[#006AFF] to-[#00B2FF] text-white rounded-xl flex items-center justify-center text-xl shadow-lg shadow-blue-500/20 group-hover:scale-110 transition-transform">
                            <i class="fab fa-facebook-messenger"></i>
                        </div>
                        <span class="text-[10px] font-bold text-slate-500">Messenger</span>
                    </button>
                    <button id="shareTwitterBtn" class="flex flex-col items-center gap-2 p-3 rounded-2xl hover:bg-slate-100 transition-all group">
                        <div class="w-12 h-12 bg-black text-white rounded-xl flex items-center justify-center text-xl shadow-lg shadow-black/20 group-hover:scale-110 transition-transform">
                            <i class="fa-brands fa-x-twitter"></i>
                        </div>
                        <span class="text-[10px] font-bold text-slate-500">X</span>
                    </button>
                </div>

                <!-- QR Code -->
                <div class="pt-2 border-t border-slate-100 text-center">
                    <p class="text-xs font-bold text-slate-400 mb-4 uppercase tracking-widest" data-lang-key="scan_qr_code">Scan QR Code</p>
                    <div id="qrCodeContainer" class="flex justify-center p-4 bg-white rounded-2xl border border-slate-100 w-fit mx-auto shadow-sm"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Offer Modal -->
    <div id="offerModal" class="modal-overlay">
        <div class="luxe-card max-w-lg w-full p-8 animate-fade-up relative">
            <button id="closeOfferModalBtn" class="absolute top-6 left-6 w-10 h-10 flex items-center justify-center rounded-full bg-slate-50 text-slate-400 hover:bg-rose-50 hover:text-rose-500 transition-all border border-slate-100 z-10">
                <i class="fas fa-times text-lg"></i>
            </button>

            <div class="flex items-center gap-4 mb-8 pr-2">
                <div class="w-14 h-14 bg-hirly-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-hirly-200 shrink-0">
                    <i class="fas fa-briefcase text-2xl"></i>
                </div>
                <div>
                    <h2 class="text-2xl font-black text-slate-900 tracking-tight" data-lang-key="send_job_offer">Send Job Offer</h2>
                    <p class="text-slate-500 font-medium text-sm" data-lang-key="hire_me">Hire Me Now</p>
                </div>
            </div>

            <form id="offerForm" class="space-y-6" dir="rtl">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest block" data-lang-key="select_job">Select Job</label>
                    <div class="relative">
                        <select id="offerJobSelect" class="w-full bg-slate-50 border-none rounded-2xl p-4 pr-10 text-slate-900 font-bold focus:ring-2 focus:ring-hirly-500 outline-none transition-all appearance-none cursor-pointer">
                            <!-- JS Inject -->
                        </select>
                        <i class="fas fa-chevron-down absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest block" data-lang-key="your_message">Your Message</label>
                    <textarea id="offerMessage" rows="4" class="w-full bg-slate-50 border-none rounded-2xl p-4 text-slate-900 font-medium placeholder:text-slate-300 focus:ring-2 focus:ring-hirly-500 outline-none transition-all resize-none" data-lang-placeholder="offer_message_placeholder"></textarea>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="submit" id="submitOfferBtn" class="flex-1 py-4 bg-hirly-600 hover:bg-hirly-700 text-white font-black rounded-2xl shadow-lg shadow-hirly-200 transition-all hover:-translate-y-0.5" data-lang-key="send_offer">Send Offer</button>
                    <button type="button" id="cancelOfferBtn" class="px-6 py-4 bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold rounded-2xl transition-all" data-lang-key="cancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Review Modal -->
    <div id="reviewModal" class="modal-overlay">
        <div class="luxe-card max-w-lg w-full p-8 animate-fade-up">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-amber-400 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-amber-100">
                        <i class="fas fa-star text-2xl"></i>
                    </div>
                    <div>
                        <h2 class="text-2xl font-black text-slate-900 tracking-tight" data-lang-key="write_review_title">Write a Review</h2>
                        <p class="text-slate-500 font-medium text-sm" data-lang-key="review_modal_subtitle">Share your experience</p>
                    </div>
                </div>
                <button id="closeReviewModalBtn" class="w-12 h-12 flex items-center justify-center rounded-2xl bg-slate-100 text-slate-400 hover:bg-rose-50 hover:text-rose-500 transition-all border border-slate-200">
                    <i class="fas fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="reviewForm" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest block" data-lang-key="select_job">Select Job</label>
                    <div class="relative">
                        <select id="reviewJobSelect" class="w-full bg-slate-50 border-none rounded-2xl p-4 pr-10 text-slate-900 font-bold focus:ring-2 focus:ring-hirly-500 outline-none transition-all appearance-none cursor-pointer">
                            <!-- JS Inject -->
                        </select>
                        <i class="fas fa-chevron-down absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>

                <div class="space-y-4">
                    <label class="text-xs font-black text-slate-500 uppercase tracking-[0.2em] block" data-lang-key="your_rating">Your Rating</label>
                    <div id="starRating" class="flex items-center gap-3 text-3xl">
                        <i class="far fa-star text-slate-300 hover:text-amber-400 transition-all cursor-pointer transform hover:scale-110" data-value="1"></i>
                        <i class="far fa-star text-slate-300 hover:text-amber-400 transition-all cursor-pointer transform hover:scale-110" data-value="2"></i>
                        <i class="far fa-star text-slate-300 hover:text-amber-400 transition-all cursor-pointer transform hover:scale-110" data-value="3"></i>
                        <i class="far fa-star text-slate-300 hover:text-amber-400 transition-all cursor-pointer transform hover:scale-110" data-value="4"></i>
                        <i class="far fa-star text-slate-300 hover:text-amber-400 transition-all cursor-pointer transform hover:scale-110" data-value="5"></i>
                    </div>
                    <input type="hidden" id="ratingInput" name="rating">
                </div>

                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-black text-slate-500 uppercase tracking-[0.2em] block" data-lang-key="your_comment">Your Feedback</label>
                        <span id="charCount" class="text-[10px] font-bold text-slate-300 uppercase tracking-widest">0/500</span>
                    </div>
                    <textarea id="reviewCommentInput" rows="5" maxlength="500" class="w-full bg-slate-50 border-2 border-slate-100 rounded-[1.5rem] p-5 text-slate-900 font-medium placeholder:text-slate-300 focus:ring-4 focus:ring-hirly-500/10 focus:border-hirly-500 outline-none transition-all resize-none shadow-inner" placeholder="Share your professional experience..."></textarea>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="submit" id="submitReviewBtn" class="flex-1 py-4 bg-hirly-600 hover:bg-hirly-700 text-white font-black rounded-2xl shadow-lg shadow-hirly-200 transition-all hover:-translate-y-0.5" data-lang-key="submit_review">Submit Review</button>
                    <button type="button" id="cancelReviewBtn" class="px-6 py-4 bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold rounded-2xl transition-all" data-lang-key="cancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Restriction Modal -->
    <div id="restrictionModal" class="modal-overlay">
        <div class="luxe-card max-w-sm w-full p-8 text-center animate-fade-up border-rose-100">
            <div id="restrictionIcon" class="w-20 h-20 bg-rose-50 rounded-[2rem] flex items-center justify-center text-rose-500 mx-auto mb-6 shadow-sm border border-rose-100">
                <i class="fas fa-lock text-3xl"></i>
            </div>
            <h2 id="restrictionTitle" class="text-2xl font-black text-slate-900 mb-2" data-lang-key="access_restricted">Access Restricted</h2>
            <p id="restrictionMessage" class="text-slate-500 font-medium mb-8 leading-relaxed">...</p>
            <div class="flex flex-col gap-3">
                <button type="button" class="w-full py-4 px-6 bg-hirly-600 text-white font-black rounded-2xl hover:bg-hirly-700 shadow-xl shadow-hirly-100 transition-all uppercase tracking-widest text-xs" id="restrictionActionBtn" data-lang-key="got_it">Got it</button>
                <button type="button" class="w-full py-4 px-6 bg-slate-50 text-slate-400 font-bold rounded-2xl hover:bg-slate-100 transition-colors text-xs uppercase tracking-widest" id="closeRestrictionModalBtn" data-lang-key="close_modal">Close</button>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmationModal" class="modal-overlay">
        <div class="luxe-card max-w-md w-full p-8 animate-fade-up">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-red-500 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-red-100">
                        <i class="fas fa-exclamation-triangle text-2xl"></i>
                    </div>
                    <div>
                        <h2 class="text-2xl font-black text-slate-900 tracking-tight" data-lang-key="confirm_action">Confirm</h2>
                        <p class="text-slate-500 font-medium text-sm" data-lang-key="confirm_action_subtitle">Please confirm</p>
                    </div>
                </div>
                <button class="w-12 h-12 flex items-center justify-center rounded-2xl bg-slate-100 text-slate-400 hover:bg-rose-50 hover:text-rose-500 transition-all border border-slate-200" onclick="hideModal(document.getElementById('confirmationModal'))">
                    <i class="fas fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="space-y-6 text-center">
                <p id="confirmationModalMessage" class="text-slate-600 font-medium text-lg leading-relaxed"></p>
                <div class="flex gap-4">
                    <button id="confirmActionBtn" class="bg-red-500 hover:bg-red-600 text-white font-black py-4 px-8 rounded-2xl flex-1 transition-all shadow-lg shadow-red-200 hover:-translate-y-0.5" data-lang-key="yes_confirm">Yes, Confirm</button>
                    <button id="cancelActionBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold py-4 px-8 rounded-2xl flex-1 transition-all" data-lang-key="cancel">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Service Details Modal -->
    <div id="serviceDetailsModal" class="modal-overlay">
        <div id="serviceDetailsModalContent" class="max-w-4xl w-full mx-6">
            <!-- Dynamic Inject -->
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="/auth.js"></script>
    <script src="/components.js"></script>
    <script src="/data/education-data.js"></script>
    <script src="/language/categories-professions-translations.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
